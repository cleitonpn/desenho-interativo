name: Publicar no GitHub Pages

on:
  push:
    branches: [claude/galinha-customizavel-app-7dg7w6, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O Pages serve em /<repo>/, entao o build precisa saber o prefixo.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Sem isso, abrir /montar direto devolve 404 do Pages em vez do app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
